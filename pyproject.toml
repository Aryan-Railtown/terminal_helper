[project]
name = "terminal-helper"
version = "0.1.0"
description = "sage: a terminal helper agent for Windows, built on railtracks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "railtracks>=1.5.6",
    "psutil>=5.9",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.scripts]
sage = "sage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: calls a real LLM; run with `pytest -m live` (needs an API key)"]
